<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add firmware to MP Selector</title>
<style>
  :root { color-scheme: dark; --ink: #f2efe8; --dim: #9a968c; --line: #34322d; --go: #e8b23a; --bad: #ef7d6a; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #151412; color: var(--ink);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  main { width: min(30rem, 100% - 2rem); padding: 2rem 0; }
  h1 { font-size: 1.5rem; font-weight: 600; margin: 0 0 1.25rem; letter-spacing: -0.01em; }
  #drop { display: grid; place-items: center; gap: .75rem; padding: 2.5rem 1rem; text-align: center; cursor: pointer;
          border: 1px dashed #55524a; border-radius: 12px; transition: border-color .15s, background .15s; }
  #drop.over, #drop:hover { border-color: var(--go); background: #1c1a17; }
  #drop input { display: none; }
  #out { margin-top: 1.25rem; min-height: 9rem; }
  #out h2 { font-size: 1.125rem; font-weight: 600; margin: 0; }
  #out p { margin: .5rem 0 0; color: var(--dim); text-wrap: pretty; }
  #out p.warn { color: var(--go); }
  #out p.bad { color: var(--bad); }
  .row { display: flex; gap: .75rem; margin-top: 1rem; flex-wrap: wrap; }
  button { font: inherit; font-weight: 600; padding: .625rem 1rem; border-radius: 8px; cursor: pointer;
           border: 1px solid var(--line); background: transparent; color: var(--ink); transition: transform .1s; }
  button.go { background: var(--go); border-color: var(--go); color: #1b1300; }
  button:active { transform: scale(.97); }
  button:disabled { opacity: .5; cursor: default; }
  footer { margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--line); color: var(--dim); font-size: .875rem; }
  a { color: inherit; }
</style>
<main>
  <h1>Add firmware to MP Selector</h1>
  <label id="drop">
    <span>Drop the firmware's ZIP here, or click to choose it</span>
    <input id="file" type="file" accept=".zip,application/zip">
  </label>
  <div id="out" aria-live="polite"></div>
  <footer id="foot"></footer>
</main>
<script type="module">
// MP Selector importer engine. Runs unchanged in a browser page and in Node 20+.
// It reads a firmware's release ZIP and returns the files to put on the card.
// Nothing from the ZIP is ever executed or extracted by path.

const K = new Uint32Array([
  0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
  0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
  0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
  0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
  0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
  0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
  0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
  0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2]);

// Streaming SHA-256, so large archives are hashed without loading them whole
// and the page does not depend on WebCrypto being available for file:// pages.
class Sha256 {
  constructor() {
    this.h = new Uint32Array([0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19]);
    this.block = new Uint8Array(64);
    this.used = 0;
    this.bytes = 0;
    this.w = new Uint32Array(64);
  }
  compress(data, at) {
    const { h, w } = this;
    for (let i = 0; i < 16; i++, at += 4) {
      w[i] = (data[at] << 24) | (data[at + 1] << 16) | (data[at + 2] << 8) | data[at + 3];
    }
    for (let i = 16; i < 64; i++) {
      const a = w[i - 15], b = w[i - 2];
      w[i] = (w[i - 16] + ((a >>> 7 | a << 25) ^ (a >>> 18 | a << 14) ^ (a >>> 3)) +
              w[i - 7] + ((b >>> 17 | b << 15) ^ (b >>> 19 | b << 13) ^ (b >>> 10))) | 0;
    }
    let [a, b, c, d, e, f, g, k] = h;
    for (let i = 0; i < 64; i++) {
      const t1 = (k + ((e >>> 6 | e << 26) ^ (e >>> 11 | e << 21) ^ (e >>> 25 | e << 7)) +
                  ((e & f) ^ (~e & g)) + K[i] + w[i]) | 0;
      const t2 = (((a >>> 2 | a << 30) ^ (a >>> 13 | a << 19) ^ (a >>> 22 | a << 10)) +
                  ((a & b) ^ (a & c) ^ (b & c))) | 0;
      k = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    h[0] += a; h[1] += b; h[2] += c; h[3] += d; h[4] += e; h[5] += f; h[6] += g; h[7] += k;
  }
  update(data) {
    let at = 0;
    this.bytes += data.length;
    if (this.used) {
      const take = Math.min(64 - this.used, data.length);
      this.block.set(data.subarray(0, take), this.used);
      this.used += take;
      at = take;
      if (this.used < 64) return this;
      this.compress(this.block, 0);
      this.used = 0;
    }
    for (; at + 64 <= data.length; at += 64) this.compress(data, at);
    this.block.set(data.subarray(at), 0);
    this.used = data.length - at;
    return this;
  }
  hex() {
    const bits = this.bytes * 8;
    const pad = new Uint8Array(((this.used + 9 + 63) & ~63) - this.used);
    pad[0] = 0x80;
    new DataView(pad.buffer).setUint32(pad.length - 8, Math.floor(bits / 2 ** 32));
    new DataView(pad.buffer).setUint32(pad.length - 4, bits >>> 0);
    this.update(pad);
    return Array.from(this.h, (v) => v.toString(16).padStart(8, '0')).join('');
  }
}

const sha256 = (bytes) => new Sha256().update(bytes).hex();

async function sha256Blob(blob, progress) {
  const hash = new Sha256();
  const step = 8 << 20;
  for (let at = 0; at < blob.size; at += step) {
    hash.update(new Uint8Array(await blob.slice(at, at + step).arrayBuffer()));
    if (progress) progress(Math.min(1, (at + step) / blob.size));
  }
  return hash.hex();
}

let crcTable;
function crc32(bytes) {
  if (!crcTable) {
    crcTable = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
      crcTable[n] = c;
    }
  }
  let c = ~0;
  for (let i = 0; i < bytes.length; i++) c = crcTable[(c ^ bytes[i]) & 255] ^ (c >>> 8);
  return ~c >>> 0;
}

const text = new TextDecoder();
const utf8 = (s) => new TextEncoder().encode(s);
const decode = (bytes) => text.decode(bytes);

async function part(blob, at, size) {
  return new DataView(await blob.slice(at, at + size).arrayBuffer());
}

// A ZIP opened from a Blob. Members are listed from the central directory and
// read one at a time, with size and CRC checked.
class Zip {
  static async open(blob) {
    const tailSize = Math.min(blob.size, 65557);
    const tail = await part(blob, blob.size - tailSize, tailSize);
    let end = -1;
    for (let i = tailSize - 22; i >= 0; i--) {
      if (tail.getUint32(i, true) === 0x06054b50) { end = i; break; }
    }
    if (end < 0) throw new Error('That file is not a ZIP.');
    const count = tail.getUint16(end + 10, true);
    const size = tail.getUint32(end + 12, true);
    const start = tail.getUint32(end + 16, true);
    if (count === 0xffff || size === 0xffffffff || start === 0xffffffff) {
      throw new Error('That ZIP is too large for this tool (ZIP64).');
    }
    const dir = await part(blob, start, size);
    const raw = new Uint8Array(dir.buffer);
    const zip = new Zip();
    zip.blob = blob;
    zip.members = new Map();
    for (let at = 0, n = 0; n < count; n++) {
      if (dir.getUint32(at, true) !== 0x02014b50) throw new Error('That ZIP is damaged.');
      const nameSize = dir.getUint16(at + 28, true);
      const name = text.decode(raw.subarray(at + 46, at + 46 + nameSize));
      if (!name.endsWith('/')) {
        zip.members.set(name, {
          name,
          encrypted: !!(dir.getUint16(at + 8, true) & 1),
          method: dir.getUint16(at + 10, true),
          crc: dir.getUint32(at + 16, true),
          packed: dir.getUint32(at + 20, true),
          size: dir.getUint32(at + 24, true),
          at: dir.getUint32(at + 42, true),
        });
      }
      at += 46 + nameSize + dir.getUint16(at + 30, true) + dir.getUint16(at + 32, true);
    }
    return zip;
  }
  names() { return [...this.members.keys()]; }
  has(name) { return this.members.has(name); }
  async read(name) {
    const m = this.members.get(name);
    if (!m) throw new Error(`The ZIP is missing ${name}.`);
    if (m.encrypted) throw new Error(`${name} is password protected.`);
    const head = await part(this.blob, m.at, 30);
    if (head.getUint32(0, true) !== 0x04034b50) throw new Error('That ZIP is damaged.');
    const from = m.at + 30 + head.getUint16(26, true) + head.getUint16(28, true);
    const packed = this.blob.slice(from, from + m.packed);
    let bytes;
    if (m.method === 0) {
      bytes = new Uint8Array(await packed.arrayBuffer());
    } else if (m.method === 8) {
      const stream = packed.stream().pipeThrough(new DecompressionStream('deflate-raw'));
      bytes = new Uint8Array(await new Response(stream).arrayBuffer());
    } else {
      throw new Error(`${name} uses a compression this tool cannot read.`);
    }
    if (bytes.length !== m.size || crc32(bytes) !== m.crc) throw new Error(`${name} is damaged in the ZIP.`);
    return bytes;
  }
}

// A stored (uncompressed) ZIP, for browsers that cannot write to a folder.
function storeZip(files) {
  const parts = [];
  const directory = [];
  let at = 0;
  for (const [path, bytes] of files) {
    const name = utf8(path);
    const head = new DataView(new ArrayBuffer(30));
    const crc = crc32(bytes);
    head.setUint32(0, 0x04034b50, true);
    head.setUint16(4, 20, true);
    head.setUint16(6, 0x0800, true);
    head.setUint16(12, 0x21, true);
    head.setUint32(14, crc, true);
    head.setUint32(18, bytes.length, true);
    head.setUint32(22, bytes.length, true);
    head.setUint16(26, name.length, true);
    const entry = new DataView(new ArrayBuffer(46));
    entry.setUint32(0, 0x02014b50, true);
    entry.setUint16(4, 20, true);
    entry.setUint16(6, 20, true);
    new Uint8Array(entry.buffer).set(new Uint8Array(head.buffer, 6, 24), 8);
    entry.setUint32(42, at, true);
    directory.push(entry.buffer, name);
    parts.push(head.buffer, name, bytes);
    at += 30 + name.length + bytes.length;
  }
  const size = directory.reduce((n, p) => n + p.byteLength, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true);
  end.setUint16(8, files.length, true);
  end.setUint16(10, files.length, true);
  end.setUint32(12, size, true);
  end.setUint32(16, at, true);
  return new Blob([...parts, ...directory, end.buffer], { type: 'application/zip' });
}

const COVER_BYTES = 96 * 96 * 2;

// RGBA pixels (96 x 96) to the selector's little-endian RGB565 cover.
function rgb565(rgba) {
  const out = new Uint8Array(COVER_BYTES);
  for (let i = 0, o = 0; o < COVER_BYTES; i += 4, o += 2) {
    const v = ((rgba[i] >> 3) << 11) | ((rgba[i + 1] >> 2) << 5) | (rgba[i + 2] >> 3);
    out[o] = v & 255;
    out[o + 1] = v >> 8;
  }
  return out;
}

// The checksum list the selector verifies before it starts an entry.
function sums(files, folder) {
  const prefix = folder + '/';
  const rows = files
    .filter(([path]) => path.startsWith(prefix) && !path.slice(prefix.length).includes('/'))
    .map(([path, bytes]) => `${sha256(bytes)}  ${path.slice(prefix.length)}\n`)
    .sort((a, b) => (a.slice(66) < b.slice(66) ? -1 : 1));
  return utf8(rows.join(''));
}

function slug(name) {
  return name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 32);
}

// What the importer knows about each firmware's release ZIP.
// plan() never touches the card. It returns the files to write.

const MELODEE_STOCK_START = 'exec /bin/systemctl start ac50.service\n';
const SIMPLE_MODEL = 'MPC-Simple/Models/spleeter-4stems.mpcsnn';

// Folder inside the ZIP that holds a given card file, or null.
function rootOf(zip, marker) {
  const hit = zip.names().find((n) => n === marker || n.endsWith('/' + marker));
  return hit == null ? null : hit.slice(0, hit.length - marker.length);
}

function entry(id, files, assets, names) {
  for (const name of names) files.push([`firmware/${id}/${name}`, assets[`${id}/${name}`]]);
  files.push([`firmware/${id}/SHA256SUMS`, sums(files, `firmware/${id}`)]);
  files.push([`firmware/${id}/cover.rgb565`, assets[`${id}/cover.rgb565`]]);
}

const READY = [
  {
    id: 'melodee',
    name: 'Melodee',
    home: 'https://github.com/keremimo/melodee-sample/releases',
    tested: { '3dbe3dd6b50bb8fefde92ff6ad436e78425ab690074b16ef32a47d2142b6e125': '0.8.2' },
    async match(zip) {
      const root = rootOf(zip, 'autorun/melodee/sample-base');
      if (root == null || !zip.has(root + 'autorun/melodee/app')) return null;
      return decode(await zip.read(root + 'autorun/melodee/app')).trim() === 'melodee' ? root : null;
    },
    async build(zip, root, assets) {
      const from = root + 'autorun/melodee/';
      const files = [];
      const stems = [];
      for (const member of zip.names().sort()) {
        if (!member.startsWith(from)) continue;
        const name = member.slice(from.length);
        if (name === 'sample-base') {
          files.push(['firmware/melodee/sample-base', await zip.read(member)]);
        } else if (/^(stems|licenses)\//.test(name) || name === 'README.txt' || name === 'VERSION') {
          // The selector copies visible files to memory. Model weights and
          // notices stay on the card in a hidden folder, where Melodee looks.
          const bytes = await zip.read(member);
          files.push(['firmware/melodee/.release/' + name, bytes]);
          if (/^stems\/[^/]+$/.test(name)) stems.push(`${sha256(bytes)}  ${name}\n`);
        }
      }
      if (!stems.length) throw new Error('This Melodee ZIP has no stems folder.');
      const restore = decode(await zip.read(from + 'restore-stock.sh'));
      if (!restore.endsWith(MELODEE_STOCK_START) || restore.split(MELODEE_STOCK_START).length !== 2) {
        throw new Error('This Melodee version shuts down in a way this tool does not know yet.');
      }
      // Keep Melodee's own cleanup. Only the selector restarts what comes next.
      files.push(['firmware/melodee/restore-selector.sh', utf8(
        restore.slice(0, -MELODEE_STOCK_START.length) + '# MP Selector resumes its menu after cleanup.\nexit 0\n')]);
      files.push(['firmware/melodee/stems.sha256', utf8(stems.join(''))]);
      entry('melodee', files, assets, ['run.sh', 'name', 'caption']);
      const version = zip.has(from + 'VERSION') ? decode(await zip.read(from + 'VERSION')).trim().split(' ')[0] : '';
      return { files, version };
    },
  },
  {
    id: 'mpc-simple',
    name: 'MPC Simple',
    home: 'https://sourceforge.net/projects/mpcsimple/files/',
    tested: { 'bd691e9b44e8263c55491aa1713cc4666bc102610a24fdb30be83a61bf2c09e2': '1.0 Beta 10' },
    async match(zip) {
      return rootOf(zip, 'autorun/mpcsimple');
    },
    async build(zip, root, assets) {
      const files = [['firmware/mpc-simple/mpcsimple', await zip.read(root + 'autorun/mpcsimple')]];
      entry('mpc-simple', files, assets, ['run.sh', 'app.sh', 'caption', 'name']);
      if (!zip.has(root + SIMPLE_MODEL)) throw new Error('This MPC Simple ZIP has no stem model.');
      // The stem model is card data. It lives outside the entry so it is not
      // copied to memory, next to the user's own projects and plugins.
      files.push([SIMPLE_MODEL, await zip.read(root + SIMPLE_MODEL)]);
      const version = (root.match(/MPC-Simple-([^/]+)\//) || [])[1] || '';
      return { files, version: version.replace(/-/g, ' '), keep: [SIMPLE_MODEL] };
    },
  },
];

// The Akai firmware MP Selector runs on. An entry's akai file must list it.
const AKAI = '1.4.0.8';
const rows = (bytes) => decode(bytes).split('\n').map((row) => row.replace(/\r$/, '')).filter(Boolean);

// A release that ships its own entry: firmware/<id>/ with name, run.sh and akai.
// Returns null when the ZIP has no such folder.
async function shipped(zip) {
  const hit = zip.names().map((n) => n.match(/^(.*\/)?firmware\/([^/]+)\/run\.sh$/)).find(Boolean);
  if (!hit) return null;
  const id = hit[2];
  const from = `${hit[1] || ''}firmware/${id}/`;
  const has = (name) => zip.has(from + name);
  const problems = [];
  if (!/^[a-z0-9][a-z0-9-]{0,31}$/.test(id) || id === 'akai') {
    problems.push(`The folder name "${id}" must be lowercase letters, numbers and dashes, 32 at most, and not "akai".`);
  }
  let name = id;
  if (!has('name')) problems.push('name is missing. It holds the title shown on screen.');
  else if (!(name = (rows(await zip.read(from + 'name'))[0] || '').trim())) problems.push('name is empty.');
  let versions = [];
  if (!has('akai')) problems.push(`akai is missing. It lists the Akai firmware versions this runs on, one per line, such as ${AKAI}.`);
  else {
    versions = rows(await zip.read(from + 'akai'));
    if (!versions.length || versions.some((v) => !/^\d+(\.\d+){3}$/.test(v))) {
      problems.push(`akai must hold only version numbers, one per line, such as ${AKAI}.`);
    }
  }
  if (decode(await zip.read(from + 'run.sh')).includes('\r')) {
    problems.push('run.sh has Windows line endings. Save it with Unix (LF) line endings.');
  }
  if (has('cover.rgb565') && (await zip.read(from + 'cover.rgb565')).length !== 96 * 96 * 2) {
    problems.push('cover.rgb565 must be 96 x 96 pixels, RGB565 little-endian: exactly 18,432 bytes.');
  }
  if (has('caption') && !/^[\x20-\x7e]*$/.test(rows(await zip.read(from + 'caption'))[0] || '')) {
    problems.push('caption must be plain ASCII.');
  }
  if (has('SHA256SUMS')) {
    for (const row of rows(await zip.read(from + 'SHA256SUMS'))) {
      const file = row.slice(66);
      if (!/^[0-9a-f]{64}  [^/]+$/.test(row)) problems.push(`SHA256SUMS has a line it cannot use: ${row}`);
      else if (!has(file)) problems.push(`SHA256SUMS lists ${file}, which is not in the folder.`);
      else if (sha256(await zip.read(from + file)) !== row.slice(0, 64)) problems.push(`SHA256SUMS does not match ${file}.`);
    }
  }
  if (problems.length) {
    return { status: 'blocked', name, reason: `firmware/${id} is not ready for MP Selector.`, problems };
  }
  const files = [];
  for (const member of zip.names().sort()) {
    if (member.startsWith(from)) files.push([`firmware/${id}/${member.slice(from.length)}`, await zip.read(member)]);
  }
  return {
    status: 'ready', id, name, home: '', version: '', tested: false, testedVersions: [], files, keep: [],
    warn: versions.includes(AKAI)
      ? 'This opens from MP Selector 1.1, which is still in testing. On 1.0.1 its cover shows "Not verified".'
      : `It lists Akai firmware ${versions.join(', ')}. MP Selector runs on ${AKAI}, where its cover shows a message and does not open.`,
  };
}

const OLD = 'It is made for Akai firmware 1.3.0.12. MP Selector 1.0.1 runs on 1.4.0.8, so it cannot open here yet.';
const LATER = 'It has not been set up for MP Selector yet.';

// Firmware this tool can name but not add. [marker file, name, reason].
const KNOWN = [
  ['autorun/mpcqol.so', 'SampQOL OS', OLD],
  ['WaveGrid/CURRENT', 'GRIDZILLA', OLD],
  ['autorun/mod-launcher.sh', 'Am MOD', OLD],
  ['autorun/rhythmer/sample-base', 'RHYTHMER OS', OLD],
  ['autorun/app.delta.gz', 'MaiaOS', OLD],
  ['autorun/minimod.so', 'MINIMOD', OLD],
  ['autorun/kaoslayer.so', 'KAOSAMPLE', OLD],
  ['autorun/stemloop-mod.so', 'MPC Stemloop', OLD],
  ['autorun/libmpc_pcmfix.so', 'USB DeClick', OLD],
  ['autorun/sampleboot/', 'SampleBoot', 'It is a boot menu of its own. Use it or MP Selector on a card, not both.'],
  ['autorun/mpc-os', 'MPC 600 S', LATER],
  ['autorun/mpc-doom', 'MP DOOM', LATER],
  ['autorun/tracker.sh', 'MPCTRACKER', LATER],
  ['autorun/doom.sh', 'MPC DOOM', LATER],
  ['autorun/epicycle/', 'EPICYCLE', LATER],
  ['Console/install.sh', 'Console', 'It installs itself onto the MPC, so it cannot run from a menu.'],
  ['FMSTEP/bin/', 'FM-STEP', LATER],
  ['BeatTrain/', 'Beat-Train', LATER],
];

function known(zip) {
  const names = zip.names();
  for (const [marker, name, reason] of KNOWN) {
    const hit = marker.endsWith('/')
      ? names.some((n) => n.startsWith(marker) || n.includes('/' + marker))
      : rootOf(zip, marker) != null;
    if (hit) return { name, reason };
  }
  return null;
}

// Decide what to do with a release ZIP.
//   { status: 'ready', id, name, version, tested, files, keep, warn }
//   { status: 'blocked', name, reason, problems, request }  request: worth asking Phil for
async function plan(zip, archiveSha, assets) {
  for (const recipe of READY) {
    const root = await recipe.match(zip);
    if (root == null) continue;
    const built = await recipe.build(zip, root, assets);
    const tested = recipe.tested[archiveSha];
    return {
      status: 'ready', id: recipe.id, name: recipe.name, home: recipe.home,
      version: tested || built.version, tested: !!tested,
      testedVersions: Object.values(recipe.tested),
      files: built.files, keep: built.keep || [],
      warn: tested ? '' :
        `Phil has not tested this version. Tested: ${Object.values(recipe.tested).join(', ')}. It should work, but if it does not, use that version.`,
    };
  }
  const own = await shipped(zip);
  if (own) return own;
  const found = known(zip);
  if (found) return { status: 'blocked', name: found.name, reason: found.reason, request: found.reason === LATER };
  const card = rootOf(zip, 'autorun/autorun.json');
  return {
    status: 'blocked', name: '', request: card != null,
    reason: card == null
      ? 'This ZIP does not look like MPC Sample firmware. Use the ZIP you downloaded from the firmware\'s own page.'
      : 'This firmware is not one MP Selector knows yet, and it does not ship an MP Selector folder, so it cannot open from the menu.',
  };
}

const SUPPORTED = READY.map((r) => ({ name: r.name, home: r.home }));

// Write a plan through a sink: { has(path), remove(path), write(path, bytes) }.
// The entry folder is replaced. Paths in plan.keep are left alone if present.
async function apply(result, sink, progress) {
  for (const need of ['autorun', 'firmware']) {
    if (!(await sink.has(need))) {
      throw new Error('That is not an MP Selector card. Pick the card that has autorun and firmware on it.');
    }
  }
  await sink.remove(`firmware/${result.id}`);
  let done = 0;
  for (const [path, bytes] of result.files) {
    if (!(result.keep.includes(path) && await sink.has(path))) await sink.write(path, bytes);
    if (progress) progress(++done / result.files.length);
  }
}

// Page behaviour for Add Firmware.html. ASSETS is injected by build.mjs.
const $ = (id) => document.getElementById(id);
const out = $('out');
const el = (tag, text, cls) => {
  const node = document.createElement(tag);
  node.textContent = text;
  if (cls) node.className = cls;
  return node;
};
const show = (...nodes) => out.replaceChildren(...nodes);
const assets = Object.fromEntries(Object.entries(ASSETS).map(([name, b64]) =>
  [name, Uint8Array.from(atob(b64), (c) => c.charCodeAt(0))]));

$('foot').append('Works with ', ...SUPPORTED.flatMap((s, i) => {
  const link = el('a', s.name);
  link.href = s.home;
  link.target = '_blank';
  link.rel = 'noopener';
  return i ? [' and ', link] : [link];
}), ', and with any firmware made for MP Selector. Download the ZIP from its own page first.');

function handleSink(root) {
  const walk = async (path, create) => {
    const parts = path.split('/');
    let dir = root;
    for (const part of parts.slice(0, -1)) dir = await dir.getDirectoryHandle(part, { create });
    return [dir, parts.at(-1)];
  };
  return {
    async has(path) {
      try {
        const [dir, name] = await walk(path, false);
        await dir.getFileHandle(name).catch(() => dir.getDirectoryHandle(name));
        return true;
      } catch { return false; }
    },
    async remove(path) {
      try {
        const [dir, name] = await walk(path, false);
        await dir.removeEntry(name, { recursive: true });
      } catch (error) {
        if (error.name !== 'NotFoundError') throw error;
      }
    },
    async write(path, bytes) {
      const [dir, name] = await walk(path, true);
      const stream = await (await dir.getFileHandle(name, { create: true })).createWritable();
      await stream.write(bytes);
      await stream.close();
    },
  };
}

function ready(result) {
  const status = el('p', '');
  const add = el('button', 'Add to card', 'go');
  const zip = el('button', 'Download as ZIP');
  const row = el('div', '', 'row');
  const busy = (on) => { add.disabled = zip.disabled = on; };
  const fail = (error) => { status.className = 'bad'; status.textContent = error.message; busy(false); };
  add.onclick = async () => {
    let card;
    try { card = await showDirectoryPicker({ mode: 'readwrite' }); } catch { return; }
    busy(true);
    status.className = '';
    try {
      await apply(result, handleSink(card), (done) => { status.textContent = `Copying ${Math.round(done * 100)}%`; });
      status.textContent = `${result.name} is on your card. Eject it and put it in your MPC.`;
      busy(false);
    } catch (error) { fail(error); }
  };
  zip.onclick = () => {
    const link = el('a', '');
    link.href = URL.createObjectURL(storeZip(result.files));
    link.download = `${result.id}-for-mp-selector.zip`;
    link.click();
    status.className = '';
    status.textContent = 'Unzip it, then copy what is inside to the top of your card. Merge the firmware folder.';
  };
  if ('showDirectoryPicker' in window) row.append(add);
  else zip.className = 'go';
  row.append(zip);
  const parts = [el('h2', `${result.name} ${result.version}`.trim())];
  if (result.warn) parts.push(el('p', result.warn, 'warn'));
  show(...parts, row, status);
}

async function load(file) {
  show(el('p', 'Reading the ZIP'));
  try {
    const hash = await sha256Blob(file);
    const result = await plan(await Zip.open(file), hash, assets);
    if (result.status === 'ready') return ready(result);
    const parts = [...(result.name ? [el('h2', result.name)] : []), el('p', result.reason, 'bad'),
      ...(result.problems || []).map((problem) => el('p', problem))];
    if (result.request) {
      // Opens a GitHub issue the person can read before sending. Nothing is sent from here.
      const ask = el('a', 'Ask Phil to add it');
      ask.href = 'https://github.com/fomoPhil/mpselector/issues/new?' + new URLSearchParams({
        title: `Firmware request: ${result.name || file.name}`,
        body: `File: ${file.name}\nSHA-256: ${hash}\n\nWhere I downloaded it:\n`,
      });
      ask.target = '_blank';
      ask.rel = 'noopener';
      parts.push(el('p', ''));
      parts.at(-1).append(ask);
    }
    show(...parts);
  } catch (error) {
    show(el('p', error.message, 'bad'));
  }
}

const drop = $('drop');
$('file').onchange = (event) => event.target.files[0] && load(event.target.files[0]);
for (const type of ['dragenter', 'dragover']) {
  addEventListener(type, (event) => { event.preventDefault(); drop.classList.add('over'); });
}
addEventListener('dragleave', () => drop.classList.remove('over'));
addEventListener('drop', (event) => {
  event.preventDefault();
  drop.classList.remove('over');
  if (event.dataTransfer.files[0]) load(event.dataTransfer.files[0]);
});
